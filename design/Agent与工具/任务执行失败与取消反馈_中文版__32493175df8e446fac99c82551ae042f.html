</div>

</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 p-margin-mobile md:p-margin-tablet max-w-3xl mx-auto w-full flex flex-col gap-lg pb-xl">
<!-- Task Info Header -->
<div class="flex flex-col gap-xs pt-sm">
<h2 class="font-title-lg text-title-lg text-on-surface">任务异常报告</h2>
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="font-label-mono text-label-mono bg-surface-container-high px-2 py-1 rounded">Task: #942</span>
<span class="font-body-md text-body-md">• 2024-05-18 14:32:05</span>
</div>
</div>
<!-- Error Card (Timeout) -->
<section class="bg-error-container text-on-error-container p-md rounded-xl shadow-sm border border-[#ffb4ab] flex flex-col gap-sm">
<div class="flex items-start gap-md">
<div class="bg-[#ffb4ab] text-[#410002] rounded-full p-2 flex items-center justify-center shrink-0 mt-1">
<span class="material-symbols-outlined" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="flex flex-col gap-xs flex-1">
<h3 class="font-title-md text-title-md font-bold text-[#410002]">任务执行超时</h3>
<p class="font-body-md text-body-md text-[#410002]/90">
                        Agent 在尝试调用日历工具时未能在预设时间内获得响应 (120s)。这通常是由于网络连接不稳定或模型服务商响应缓慢导致的。
                    </p>
<div class="mt-sm bg-surface-container-lowest/50 rounded-lg p-sm border border-[#ffb4ab]/50 flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-mono text-label-mono text-[#410002]/70">Task ID</span>
<span class="font-code-block text-code-block text-[#410002]">task_942_error</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-mono text-label-mono text-[#410002]/70">Error Code</span>
<span class="font-code-block text-code-block font-semibold text-[#93000a]">LLM_TIMEOUT</span>
</div>
</div>
</div>
</div>
</section>
<!-- User Cancelled Card -->
<section class="bg-surface-container-low border border-outline-variant p-md rounded-xl flex flex-col gap-sm">
<div class="flex items-start gap-md">
<div class="bg-surface-container-highest text-on-surface-variant rounded-full p-2 flex items-center justify-center shrink-0 mt-1">
<span class="material-symbols-outlined" data-icon="cancel" style="font-variation-settings: 'FILL' 1;">cancel</span>
</div>
<div class="flex flex-col gap-xs flex-1">
<h3 class="font-title-md text-title-md font-medium text-on-surface">任务已由用户取消</h3>
<p class="font-body-md text-body-md text-on-surface-variant">
                        当前推理循环 (Loop 3/8) 已安全中止，所有已产生的系统副作用均已通过幂等键锁定。
                    </p>
<div class="mt-xs flex items-center gap-2">
<span class="inline-flex items-center gap-1 bg-surface-container px-2 py-1 rounded text-on-surface-variant font-label-mono text-label-mono">
<span class="material-symbols-outlined text-[14px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>

                        </span>
</div>
</div>
</div>

            </button>

            </button>
</div>

<button class="text-primary hover:text-primary-fixed-variant font-title-md text-title-md px-md py-sm rounded-full hover:bg-surface-container transition-colors flex items-center justify-center gap-2 active:scale-95 duration-150">
