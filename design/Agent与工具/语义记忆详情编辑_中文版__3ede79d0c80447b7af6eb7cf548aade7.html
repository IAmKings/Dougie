<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Memory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "background": "#f8faf9",
                        "surface-bright": "#f8faf9",
                        "error": "#ba1a1a",
                        "tertiary-container": "#557280",
                        "on-tertiary-container": "#e2f4ff",
                        "surface-variant": "#e1e3e2",
                        "tertiary-fixed-dim": "#adcbda",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#002020",
                        "terminal-bg": "#0D0F0F",
                        "secondary": "#006a6a",
                        "on-secondary-fixed-variant": "#004f50",
                        "on-tertiary-fixed": "#001f2a",
                        "surface-container-low": "#f2f4f3",
                        "on-surface-variant": "#444651",
                        "on-background": "#191c1c",
                        "status-executing": "#FFB300",
                        "on-primary-container": "#f0f0ff",
                        "surface-container-high": "#e7e8e8",
                        "primary": "#3d5198",
                        "status-thinking": "#566ab2",
                        "inverse-primary": "#b6c4ff",
                        "surface-tint": "#465aa1",
                        "on-primary-fixed-variant": "#2d4288",
                        "surface-dim": "#d9dada",
                        "status-completed": "#2E7D32",
                        "tertiary-fixed": "#c9e7f7",
                        "surface": "#f8faf9",
                        "primary-container": "#566ab2",
                        "secondary-fixed-dim": "#4cdada",
                        "surface-container-highest": "#e1e3e2",
                        "on-error": "#ffffff",
                        "outline-variant": "#c5c5d2",
                        "tertiary": "#3d5a67",
                        "inverse-on-surface": "#eff1f0",
                        "primary-fixed-dim": "#b6c4ff",
                        "risk-high": "#BA1A1A",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#757682",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2e3131",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191c1c",
                        "on-secondary-container": "#007070",
                        "primary-fixed": "#dce1ff",
                        "surface-container": "#edeeed",
                        "secondary-fixed": "#6ef7f6",
                        "secondary-container": "#6ef7f6",
                        "on-primary-fixed": "#001550",
                        "on-tertiary-fixed-variant": "#2e4b57",
                        "status-failed": "#D32F2F"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-tablet": "24px",
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "32px",
                        "baseline": "8px",
                        "gutter": "16px",
                        "md": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "code-block": ["JetBrains Mono"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "code-block": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky z-10">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">编辑记忆</h1>
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined text-risk-high" data-icon="delete">delete</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-margin-mobile py-lg gap-lg max-w-3xl mx-auto w-full">
<!-- Fact Content Card -->
<section class="flex flex-col gap-sm">
<label class="font-title-md text-title-md text-on-surface" for="memory-fact">核心事实</label>
<div class="relative">
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-md font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface resize-none transition-all" id="memory-fact" placeholder="输入记忆事实..." rows="4">用户喜欢在周五下午喝无糖可乐</textarea>
<div class="absolute bottom-md right-md flex items-center gap-xs text-status-thinking bg-surface px-2 py-1 rounded-sm shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="psychology">psychology</span>
<span class="font-label-mono text-label-mono">语义已解析</span>
</div>
</div>
</section>
<!-- Metadata Section (Bento Style) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Source & Confidence -->
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-md">
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="source">source</span>
                        来源追踪
                    </h3>
<a class="inline-flex items-center gap-xs text-primary font-body-md text-body-md hover:underline bg-primary-container/10 px-2 py-1 rounded-md transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="chat">chat</span>
                        2026-08-14 对话
                    </a>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="analytics">analytics</span>
                        置信度
                    </h3>
<div class="flex items-center gap-md">
<div class="flex-grow h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-status-completed w-[92%] rounded-full"></div>
</div>
<span class="font-label-mono text-label-mono text-status-completed font-bold">92%</span>
</div>
</div>
</div>
<!-- Timestamps -->
<div class="bg-surface-container-low rounded-xl p-md flex flex-col justify-center gap-md font-code-block text-code-block text-on-surface-variant">
<div class="flex justify-between items-center border-b border-surface-variant pb-sm">
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span> 创建于</span>
<span>2026-08-14 15:32</span>
</div>
<div class="flex justify-between items-center">
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="update">update</span> 最近更新</span>
<span>2026-08-15 09:14</span>
</div>
</div>
</section>
<!-- Actions -->
<section class="mt-auto pt-xl flex flex-col sm:flex-row-reverse gap-md">
<button class="bg-primary text-on-primary font-title-md text-title-md rounded-full py-3 px-6 flex-1 hover:bg-primary/90 transition-colors active:scale-[0.98] shadow-sm flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="save">save</span>
                保存修改
            </button>
<button class="bg-surface-container-high text-on-surface font-title-md text-title-md rounded-full py-3 px-6 flex-1 hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
                取消
            </button>
</section>
<!-- Privacy Note -->
<footer class="text-center pb-md">
<p class="font-label-mono text-label-mono text-on-surface-variant flex items-center justify-center gap-xs opacity-70">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
                记忆仅存储于本地，受隐私策略保护
            </p>
</footer>
</main>
</body></html>
