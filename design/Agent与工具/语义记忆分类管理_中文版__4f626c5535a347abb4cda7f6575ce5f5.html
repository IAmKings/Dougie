<script>
        // Simple script to handle tab selection visual state
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.px-margin-mobile.sticky.top-28 button');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Reset all tabs
                    tabs.forEach(t => {
                        t.className = "whitespace-nowrap px-4 py-2 rounded-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container font-title-md text-title-md transition-colors active:scale-95 border border-outline-variant" + (t.innerHTML.includes('warning') ? ' flex items-center gap-1' : '');
                    });
                    // Set active tab
                    tab.className = "whitespace-nowrap px-4 py-2 rounded-lg bg-primary-container text-on-primary-container font-title-md text-title-md transition-colors active:scale-95" + (tab.innerHTML.includes('warning') ? ' flex items-center gap-1' : '');
                });
            });
        });
