<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {

        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e1e3e2; /* surface-variant */
            border-radius: 10px;
        }

      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface-container flex justify-between items-center w-full px-4 md:px-8 py-3 sticky top-0 z-40 transition-shadow">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full overflow-hidden border border-surface-variant flex-shrink-0">

</div>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary">Waku-Android</h1>
</div>
<!-- Desktop Nav Cluster -->
<nav class="hidden md:flex items-center gap-6">
<a class="text-on-surface-variant hover:bg-surface-variant px-3 py-2 rounded-lg transition-colors font-title-md text-title-md flex items-center gap-2" href="#">
<span class="material-symbols-outlined">chat</span> 聊天
            </a>
<a class="text-on-surface-variant hover:bg-surface-variant px-3 py-2 rounded-lg transition-colors font-title-md text-title-md flex items-center gap-2" href="#">
<span class="material-symbols-outlined">history</span> 任务
            </a>
<a class="text-on-surface font-bold bg-surface-variant px-3 py-2 rounded-lg transition-colors font-title-md text-title-md flex items-center gap-2" href="#">
<span class="material-symbols-outlined fill-icon">database</span> 记忆
            </a>
<a class="text-on-surface-variant hover:bg-surface-variant px-3 py-2 rounded-lg transition-colors font-title-md text-title-md flex items-center gap-2" href="#">
<span class="material-symbols-outlined">settings</span> 设置
            </a>
</nav>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-primary">
<span class="material-symbols-outlined">shield_with_heart</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col w-full max-w-5xl mx-auto px-margin-mobile md:px-margin-tablet py-lg pb-32 md:pb-lg gap-lg">
<!-- Header & Actions -->
<div class="flex flex-col md:flex-row md:items-end justify-between gap-md">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-background">记忆查看器</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">审计并管理本地优先的语义知识库。</p>
</div>
<div class="flex items-center gap-md">
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface px-4 py-2 rounded-sm font-title-md text-title-md flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[20px]">download</span> 导出事实
                </button>
<button class="bg-error-container hover:bg-error text-on-error-container hover:text-on-error px-4 py-2 rounded-sm font-title-md text-title-md flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span> 清除全部记忆
                </button>
</div>
</div>
<!-- Conversation Memory Search -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-lg text-title-lg text-on-background">对话记忆</h3>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow shadow-sm" placeholder="搜索对话上下文..." type="text"/>
</div>
</section>
<!-- Facts (Long-term) -->
<section class="flex flex-col gap-md">
<h3 class="font-title-lg text-title-lg text-on-background border-b border-surface-variant pb-2">长期事实</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Fact Card 1 -->
<div class="bg-surface-container-low border border-surface-variant rounded-xl p-md flex flex-col gap-sm hover:bg-surface-container transition-colors group relative overflow-hidden">
<!-- Subtle tonal shift on top edge -->
<div class="absolute top-0 left-0 w-full h-1 bg-tertiary-container opacity-50"></div>
<p class="font-body-lg text-body-lg text-on-surface pr-8">用户偏好在下午接收 UNO 项目更新。</p>
<div class="mt-auto pt-sm flex items-center justify-between">
<span class="inline-flex items-center gap-1.5 px-2 py-1 bg-surface-variant text-on-surface-variant rounded-sm font-label-mono text-label-mono">
<span class="material-symbols-outlined text-[14px]">chat</span> 来源: Chat #12
                        </span>
<button aria-label="Delete Fact" class="text-outline hover:text-error transition-colors opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Fact Card 2 -->
<div class="bg-surface-container-low border border-surface-variant rounded-xl p-md flex flex-col gap-sm hover:bg-surface-container transition-colors group relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-primary opacity-50"></div>
<p class="font-body-lg text-body-lg text-on-surface pr-8">家庭住址: <span class="font-code-block text-code-block text-on-surface-variant">[为保护隐私已截断]</span>。</p>
<div class="mt-auto pt-sm flex items-center justify-between">
<span class="inline-flex items-center gap-1.5 px-2 py-1 bg-primary-fixed text-on-primary-fixed rounded-sm font-label-mono text-label-mono">
<span class="material-symbols-outlined text-[14px]">location_on</span> 来源: Location Tool
                        </span>
<button aria-label="Delete Fact" class="text-outline hover:text-error transition-colors opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
</div>
</section>

</a>
