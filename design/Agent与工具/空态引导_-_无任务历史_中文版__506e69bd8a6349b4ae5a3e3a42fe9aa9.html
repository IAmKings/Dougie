</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">Agent KISS</h1>
<div class="h-8 w-8 rounded-full overflow-hidden bg-surface-variant border border-outline-variant flex-shrink-0 cursor-pointer hover:opacity-80 transition-opacity">

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-tablet py-xl max-w-2xl mx-auto w-full text-center">
<!-- Desaturated Brand Icon -->
<div class="mb-lg opacity-40 grayscale mix-blend-multiply w-48 h-48 md:w-64 md:h-64 flex items-center justify-center pointer-events-none">
<img alt="Doge AI Icon desaturated" class="w-full h-full object-contain" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
</div>
<!-- Headline & Context -->
<div class="mb-xl max-w-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">暂无活跃任务</h2>
<p class="font-body-md text-body-md text-on-surface-variant">当你发出指令后，任务的执行进度、状态和审计日志会出现在这里。</p>
</div>
<!-- Suggested Command Action -->
<button class="w-full max-w-md bg-surface-container-low border border-outline-variant rounded-xl p-md flex items-center gap-md hover:bg-surface-container transition-colors duration-200 group text-left shadow-sm active:scale-[0.98]">
<div class="h-10 w-10 rounded-full bg-primary-container/20 flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-container/30 transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">tips_and_updates</span>
</div>
<div class="flex-grow">
<span class="block font-label-mono text-label-mono text-primary mb-xs uppercase">尝试问我</span>
<span class="block font-title-md text-title-md text-on-surface">明天下午三点提醒我开会</span>
</div>
<span aria-hidden="true" class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">arrow_forward</span>
</button>
</main>

<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container dark:bg-surface-container-lowest shadow-sm flex justify-around items-center h-20 pb-safe px-4">
