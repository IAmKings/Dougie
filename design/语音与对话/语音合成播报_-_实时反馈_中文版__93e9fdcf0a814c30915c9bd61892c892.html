<style>
        /* Custom Waveform Animations */
        @keyframes wave {
            0% { transform: scaleY(0.2); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0.2); opacity: 0.6; }
        }
        .bar {
            animation: wave 1.2s infinite ease-in-out;
            transform-origin: bottom;
        }
        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }
        .bar:nth-child(5) { animation-delay: 0.8s; }
        .bar:nth-child(6) { animation-delay: 0.3s; }
        .bar:nth-child(7) { animation-delay: 0.1s; }
        .bar:nth-child(8) { animation-delay: 0.5s; }
        .bar:nth-child(9) { animation-delay: 0.7s; }
        .bar:nth-child(10) { animation-delay: 0.2s; }
        
        /* Subtle float for Doge watermark */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.03; }
            50% { transform: translateY(-10px) rotate(2deg); opacity: 0.05; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.03; }
        }
        .watermark-anim {
            animation: float 8s infinite ease-in-out;
        }
        
        /* Text entrance animation */
        @keyframes textReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .text-reveal {
            animation: textReveal 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Ambient Background Watermark -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center z-0 overflow-hidden">

</div>
<!-- TopAppBar -->

<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg text-on-surface font-semibold flex-1 text-center">
            Waku 对话 - 语音播报
        </h1>
<div class="w-10 h-10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 relative z-10 w-full max-w-md mx-auto">
<!-- Status Indicator / Local Execution Tag -->
<div class="mb-12 flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-full border border-surface-variant shadow-sm text-reveal" style="animation-delay: 0.1s; opacity: 0;">

            </p>
</div>
<!-- Playback Visualization (Waveform) -->

<div class="bar w-2 h-8 bg-primary rounded-t-sm"></div>
<div class="bar w-2 h-16 bg-primary-container rounded-t-sm"></div>
<div class="bar w-2 h-12 bg-primary rounded-t-sm"></div>
