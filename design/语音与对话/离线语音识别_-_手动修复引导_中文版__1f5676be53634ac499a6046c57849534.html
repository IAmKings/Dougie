<!DOCTYPE html>

<html lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>语音模型修复</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#c5c5d2",
                        "on-surface": "#191c1c",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#eff1f0",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f4f3",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container": "#edeeed",
                        "status-completed": "#2E7D32",
                        "secondary-fixed-dim": "#4cdada",
                        "status-thinking": "#566ab2",
                        "inverse-primary": "#b6c4ff",
                        "tertiary": "#3d5a67",
                        "surface": "#f8faf9",
                        "on-primary-fixed-variant": "#2d4288",
                        "on-secondary-fixed": "#002020",
                        "outline": "#757682",
                        "on-tertiary-fixed-variant": "#2e4b57",
                        "primary-fixed": "#dce1ff",
                        "on-tertiary-fixed": "#001f2a",
                        "surface-tint": "#465aa1",
                        "surface-dim": "#d9dada",
                        "secondary": "#006a6a",
                        "tertiary-fixed": "#c9e7f7",
                        "primary-container": "#566ab2",
                        "risk-high": "#BA1A1A",
                        "on-secondary-fixed-variant": "#004f50",
                        "on-secondary-container": "#007070",
                        "status-executing": "#FFB300",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#e2f4ff",
                        "on-primary-fixed": "#001550",
                        "surface-variant": "#e1e3e2",
                        "terminal-bg": "#0D0F0F",
                        "primary": "#3d5198",
                        "on-surface-variant": "#444651",
                        "tertiary-container": "#557280",
                        "background": "#f8faf9",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e7e8e8",
                        "on-primary-container": "#f0f0ff",
                        "on-background": "#191c1c",
                        "surface-container-highest": "#e1e3e2",
                        "tertiary-fixed-dim": "#adcbda",
                        "secondary-fixed": "#6ef7f6",
                        "surface-bright": "#f8faf9",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3131",
                        "secondary-container": "#6ef7f6",
                        "status-failed": "#D32F2F"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        lg: "24px",
                        "margin-mobile": "16px",
                        "margin-tablet": "24px",
                        "gutter": "16px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "baseline": "8px",
                        "xl": "32px"
                    },
                    fontFamily: {
                        "code-block": ["JetBrains Mono"],
                        "title-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-mono": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "code-block": ["13px", { lineHeight: "18px", fontWeight: "400" }],
                        "title-md": ["16px", { lineHeight: "24px", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "title-lg": ["20px", { lineHeight: "28px", fontWeight: "500" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-mono": ["12px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.surface'); color: theme('colors.on-surface'); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md pb-[72px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-4 md:px-8 py-3 bg-surface-container h-[64px] shrink-0 sticky top-0 z-10 transition-all duration-200">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary">语音模型修复</h1>
</div>
<div class="flex items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant text-primary transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">shield_with_heart</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile md:px-margin-tablet py-lg max-w-[600px] mx-auto w-full flex flex-col gap-lg">
<!-- Error State Card -->
<section class="bg-error-container rounded-xl p-md flex flex-col items-center text-center gap-sm shadow-sm transition-transform duration-300 hover:scale-[1.01]">
<div class="w-16 h-16 rounded-full bg-error/10 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-4xl text-error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<h2 class="text-title-lg font-title-lg text-on-error-container">下载已中断</h2>
<p class="text-body-md font-body-md text-on-error-container/80">网络连接异常，无法完成 Paraformer-zh 模型下载。离线识别暂不可用。</p>
</section>
<!-- Diagnostics Section -->
<section class="flex flex-col gap-sm">
<h3 class="text-label-mono font-label-mono text-outline uppercase tracking-wider mb-2">系统诊断</h3>
<div class="bg-surface-container-low rounded-lg p-md flex items-center justify-between">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">wifi_off</span>
<div>
<div class="text-title-md font-title-md text-on-surface">网络连接</div>
<div class="text-body-sm font-code-block text-error mt-1">Status: Disconnected (WiFi)</div>
</div>
</div>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">cancel</span>
</div>
<div class="bg-surface-container-low rounded-lg p-md flex items-center justify-between">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">hard_drive</span>
<div>
<div class="text-title-md font-title-md text-on-surface">存储空间</div>
<div class="text-body-sm font-code-block text-status-completed mt-1">Available: 4.2 GB / Required: 850 MB</div>
</div>
</div>
<span class="material-symbols-outlined text-status-completed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</section>
<!-- Action Area -->
<section class="flex flex-col gap-md mt-4">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary text-title-md font-title-md py-3 rounded-lg flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] shadow-sm">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">download</span>
                重新下载
            </button>
<button class="w-full bg-surface-container hover:bg-surface-variant text-on-surface text-title-md font-title-md py-3 rounded-lg flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">settings</span>
                检查网络设置
            </button>
<div class="text-center mt-4">
<a class="text-label-mono font-label-mono text-primary hover:underline underline-offset-4 flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">file_upload</span>
                    手动下载后导入 (Sideload)
                </a>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-2 bg-surface h-[72px] shadow-[0_-1px_3px_rgba(0,0,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">chat</span>
<span class="text-label-mono font-label-mono">Chat</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="text-label-mono font-label-mono">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">database</span>
<span class="text-label-mono font-label-mono">Memory</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-label-mono font-label-mono font-bold">Settings</span>
</a>
</nav>
</body></html>
