<style>

            width: 20px;

<body class="bg-background text-on-background min-h-screen flex flex-col pb-20">
<!-- TopAppBar -->

<button class="material-symbols-outlined text-primary text-title-lg font-title-lg mr-4 hover:bg-surface-variant/50 transition-colors rounded-full p-2 active:opacity-80">arrow_back</button>
<h1 class="font-title-lg text-title-lg text-on-surface flex-1">语音灵敏度调节</h1>
</header>
<main class="flex-1 p-margin-mobile flex flex-col gap-lg">
<!-- Info Card -->
<section class="bg-surface-container-low p-md rounded-lg border border-surface-variant">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                    语音活动检测 (VAD) 帮助 Waku Agent 自动判断您何时开始说话及何时结束，避免记录背景噪音并提高离线 Paraformer-zh 模型的识别效率。
                </p>
</div>
</section>
<!-- VAD Monitor Section -->
<section class="bg-surface-container-low p-md rounded-xl shadow-sm border border-surface-variant">
<h2 class="font-title-md text-title-md text-on-surface mb-sm flex justify-between items-center">
                实时环境声级 (VAD)
                <span class="font-label-mono text-label-mono text-status-executing flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-status-executing animate-pulse"></span>
                    监听中
                </span>
</h2>
<div class="relative h-48 bg-surface-container rounded-lg p-sm flex items-end justify-between gap-1 overflow-hidden" id="waveform-container">
<!-- Threshold Line -->
<div class="threshold-line" id="visual-threshold" style="bottom: 40%;"></div>
<div class="absolute right-2 text-xs font-label-mono text-error bg-surface-container-lowest/80 px-1 rounded z-20" id="threshold-label" style="bottom: calc(40% + 4px);">40 dB</div>
<!-- Waveform Bars (Generated via JS) -->
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center">
                当前音量: <span class="font-label-mono font-bold text-primary" id="current-db">32 dB</span>
</p>
</section>
<!-- Threshold Slider -->
<section>
<label class="font-title-md text-title-md text-on-surface block mb-sm">VAD 启动阈值</label>
<div class="flex items-center justify-between mb-xs">
<span class="font-body-md text-body-md text-on-surface-variant text-xs">低 (安静环境)</span>
<span class="font-body-md text-body-md text-on-surface-variant text-xs">高 (嘈杂环境)</span>
</div>
<input class="w-full" id="threshold-slider" max="90" min="10" type="range" value="40"/>
<div class="flex justify-between mt-sm">

            </p>

</a>

<script>
        // Waveform Animation Logic
        const container = document.getElementById('waveform-container');
        const numBars = 30;
        const bars = [];
        
        for(let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            bar.style.height = '10%';
            container.appendChild(bar);
            bars.push(bar);
        }

        const thresholdSlider = document.getElementById('threshold-slider');
        const visualThreshold = document.getElementById('visual-threshold');
        const thresholdLabel = document.getElementById('threshold-label');
        const sliderVal = document.getElementById('slider-val');
        const currentDbLabel = document.getElementById('current-db');

        thresholdSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            visualThreshold.style.bottom = `${val}%`;
            thresholdLabel.style.bottom = `calc(${val}% + 4px)`;
            thresholdLabel.textContent = `${val} dB`;
            sliderVal.textContent = `${val}dB`;
        });

        const silenceSlider = document.getElementById('silence-slider');
        const silenceVal = document.getElementById('silence-val');
        
        silenceSlider.addEventListener('input', (e) => {
            silenceVal.textContent = `${e.target.value}ms`;
        });

        // Simulate audio input
        setInterval(() => {
            // Shift bars left
            for(let i = 0; i < bars.length - 1; i++) {
                bars[i].style.height = bars[i+1].style.height;
                bars[i].style.backgroundColor = bars[i+1].style.backgroundColor;
            }
            
            // Generate new value for rightmost bar
            const threshold = parseInt(thresholdSlider.value);
            // Bias noise generally lower, occasional spikes
            let newDb = Math.floor(Math.random() * 40) + 10; 
            if(Math.random() > 0.8) newDb += Math.floor(Math.random() * 40); // speak spike
            
            if(newDb > 100) newDb = 100;

            const lastBar = bars[bars.length - 1];
            lastBar.style.height = `${newDb}%`;
            
            // Color based on threshold
            if(newDb >= threshold) {
                lastBar.style.backgroundColor = 'var(--tw-colors-status-completed, #2E7D32)';
            } else {
                lastBar.style.backgroundColor = 'var(--tw-colors-primary-container, #566ab2)';
            }

            currentDbLabel.textContent = `${newDb} dB`;
            
        }, 150);
    </script>
