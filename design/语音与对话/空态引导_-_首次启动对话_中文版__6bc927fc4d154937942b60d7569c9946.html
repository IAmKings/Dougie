<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-margin-mobile h-16 transition-colors duration-200 ease-in-out z-40">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-surface-variant/50 p-2 rounded-full transition-colors flex items-center justify-center">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Agent KISS</h1>
</div>
<div>

<span class="material-symbols-outlined text-primary" data-icon="account_circle" style="font-size: 32px;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pt-8 pb-32 w-full max-w-2xl mx-auto">

<div class="mb-10 w-48 h-48 md:w-56 md:h-56 relative flex items-center justify-center">

</div>

<h2 class="font-headline-lg text-headline-lg text-primary mb-4">你好，我是你的端侧智能体</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                本地理解上下文，保护你的隐私。<br/>尝试问我：
            </p>
</div>

<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-3 hover:bg-surface-container-low transition-colors text-left group shadow-sm">
<div class="bg-primary/10 text-primary rounded-full p-2 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-title-md" data-icon="battery_horiz_075">battery_horiz_075</span>
</div>
<span class="font-title-md text-title-md text-on-surface">查下手机电量</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-3 hover:bg-surface-container-low transition-colors text-left group shadow-sm">
<div class="bg-primary/10 text-primary rounded-full p-2 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-title-md" data-icon="calendar_month">calendar_month</span>
</div>
<span class="font-title-md text-title-md text-on-surface">明天下午3点开会</span>

<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-3 hover:bg-surface-container-low transition-colors text-left group shadow-sm">

<span class="material-symbols-outlined text-title-md" data-icon="security">security</span>
</div>

<span class="font-label-mono text-label-mono mt-1 group-hover:text-primary transition-colors">Safety</span>
</button>
