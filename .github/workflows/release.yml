name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 git 标签（如 v0.1.0）。留空则使用当前 HEAD 并要求仓库已打标签。"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK pieces
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          TAG="${RAW#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "标签必须是 v主.次.补丁，例如 v0.1.0，当前: $TAG"
            exit 1
          fi
          NAME="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$NAME"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，将使用 debug 签名。"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dougie-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dougie-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:checkChannelLeak \
            :app:assemblePlayRelease \
            :app:assembleSideloadRelease \
            -PdougieVersionName=${{ steps.version.outputs.name }} \
            -PdougieVersionCode=${{ steps.version.outputs.code }}

      - name: Stage artifacts
        id: artifacts
        run: |
          mkdir -p dist
          PLAY="app/build/outputs/apk/play/release/app-play-release.apk"
          SIDE="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -f "$PLAY" && test -f "$SIDE"
          cp "$PLAY" "dist/Dougie-${{ steps.version.outputs.name }}-play.apk"
          cp "$SIDE" "dist/Dougie-${{ steps.version.outputs.name }}-sideload.apk"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            echo "signed=upload" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dougie ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.artifacts.outputs.signed == 'debug' }}
          files: |
            dist/Dougie-${{ steps.version.outputs.name }}-play.apk
            dist/Dougie-${{ steps.version.outputs.name }}-sideload.apk
          body: |
            Play 包 `com.dougie.app`，侧载包 `com.dougie.app.sideload`。侧载含无障碍能力；Play 包不得含 onnx 权重。

            ${{ steps.artifacts.outputs.signed == 'debug' && '未配置 ANDROID_KEYSTORE_* 密钥，本构建使用 debug 签名，标为预发布。配置仓库 Secrets 后重打标签即可得到上传密钥签名。' || '已使用仓库 Secrets 中的上传密钥签名。' }}
